spring:
  mail:
    host: ${EMAIL_SMTP_HOST:smtp.gmail.com}
    port: ${EMAIL_SMTP_PORT:465}
    username: ${EMAIL_SMTP_USERNAME:disabled}
    password: ${EMAIL_SMTP_PASSWORD:disabled}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 3
    locations: classpath:db/migration
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
  upload:
    base-dir: /app/uploads
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://vetclinic.vercel.app}
  sms:
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:disabled}
      auth-token: ${TWILIO_AUTH_TOKEN:disabled}
      from-number: ${TWILIO_FROM_NUMBER:+0000000000}
      enabled: ${TWILIO_ENABLED:false}
  email:
    from: ${EMAIL_FROM:onboarding@resend.dev}
    enabled: ${EMAIL_ENABLED:false}
    resend:
      api-key: ${RESEND_API_KEY:disabled}

logging:
  level:
    com.softart.vetclinic: INFO
