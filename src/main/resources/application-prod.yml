spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
  upload:
    base-dir: /app/uploads
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://vetclinic.vercel.app}

logging:
  level:
    com.softart.vetclinic: INFO
